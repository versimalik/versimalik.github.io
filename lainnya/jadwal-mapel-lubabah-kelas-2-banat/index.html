        ["09.45","10.20","Al Qur'an", "Guru Halaqoh"],
        ["10.20","10.55","Bahasa Inggris", "Bunda Risma"],
        ["10.55","11.30","Bahasa Inggris", "Bunda Risma"],
        ["11.30","12.15","Sholat Dzuhur", ""],

      Kamis: [
        ["07.15","07.30","Dzikir Pagi", ""],
        ["07.30","08.05","Bahasa Indonesia", "Bunda Sela"],

      ],
      "Jum'at": [
        ["07.15","07.30","Surah Al Kahfi", ""],

        ["08.05","08.40","Al Qur'an", "Guru Halaqoh"],
        ["08.40","09.10","Istirahat", ""],
        ["09.10","09.45","Bahasa Indonesia", "Bunda Sela"],
        ["09.45","10.20","Bahasa Indonesia", "Bunda Sela"],
        ["10.20","10.35","Refleksi oleh Walas", ""]
      ]
    };

    const DAY_ORDER = ["Senin","Selasa","Rabu","Kamis","Jum'at"];
    const JS_DAY_TO_NAME = {1:"Senin",2:"Selasa",3:"Rabu",4:"Kamis",5:"Jum'at"};

    let activeDay = JS_DAY_TO_NAME[new Date().getDay()] || "Senin";

    function renderTabs() {
      const ul = document.getElementById("dayTabs");
      ul.innerHTML = "";
      DAY_ORDER.forEach(day => {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.setAttribute("role", "button");
        a.href = "#";
        a.textContent = day;
        if (day === activeDay) {
          a.setAttribute("aria-current", "true");
        } else {
          a.classList.add("outline");
        }
        a.addEventListener("click", (e) => { e.preventDefault(); activeDay = day; render(); });
        li.appendChild(a);
        ul.appendChild(li);
      });
    }

    function render() {
      renderTabs();
      const tbody = document.getElementById("jadwalBody");
      tbody.innerHTML = "";
      DATA[activeDay].forEach((row, i) => {
        const [start, end, subject, teacher] = row;
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${i+1}</td><td>${start}&ndash;${end}</td><td>${subject}</td><td>${teacher}</td>`;
        tbody.appendChild(tr);
      });
    }

    render();

    // (Opsional) Setel og:url secara dinamis dengan URL halaman saat ini
    // Agar saat dishare, URL yang terdeteksi sesuai.
    document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
  </script>
