<script>
    (function() {
        function applySystemTheme() {
            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const desiredTheme = isDarkMode ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', desiredTheme);
            try {
                sessionStorage.setItem('lastAutoTheme', desiredTheme);
            } catch(e) {}
        }
        applySystemTheme();
        const darkModeMedia = window.matchMedia('(prefers-color-scheme: dark)');
        if (darkModeMedia.addEventListener) {
            darkModeMedia.addEventListener('change', (event) => {
                applySystemTheme();
            });
        } 
        else if (darkModeMedia.addListener) {
            darkModeMedia.addListener((event) => {
                applySystemTheme();
            });
        }
    })();
</script>
