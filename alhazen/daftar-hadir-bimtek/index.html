      <h1>Daftar Hadir</h1>
      <p>Bimtek "AI Bukan Jimat" — Alhazen Academy untuk Guru Indonesia</p>
    </hgroup>

    <!-- Data dikirim lewat JavaScript ke Google Apps Script (lihat APPS_SCRIPT_URL). -->
    <form id="attendance-form" novalidate>

      <label for="nama">Nama
        <input type="text" id="nama" name="nama" required minlength="3" autocomplete="name">
        <small>Gunakan nama lengkap dan jelas, boleh menyertakan gelar, untuk keperluan sertifikat.</small>
      </label>


      <label for="tempat">Tempat Bertugas
        <input type="text" id="tempat" name="tempat-tugas" required
               value="">
      </label>

      <label for="hp">No. HP / WA
        <input type="tel" id="hp" name="no-wa" required
               pattern="^(0|\+62|62)8[1-9][0-9]{7,11}$"
               title="Contoh: 08123456789 atau +628123456789"
               inputmode="numeric" placeholder="08xxxxxxxxxx" autocomplete="tel">
        <small id="hp-helper">Format: 08xxxxxxxxxx atau +628xxxxxxxxxx</small>
      </label>


      <label for="email">Email Aktif
        <input type="email" id="email" name="email" required autocomplete="email">
        <small id="email-helper">Pastikan email aktif — materi bimtek akan dikirim ke email ini.</small>
      </label>


      <button type="submit" id="submit-button">Kirim Kehadiran</button>
      <small id="form-status" role="status" aria-live="polite"></small>
    </form>

    <dialog id="thanks-modal">
      <article>
        <h3>Terima kasih!</h3>
        <p>Kehadiran Anda telah tercatat. Materi bimtek akan dikirimkan melalui email yang Anda daftarkan.</p>
        <footer>
          <button onclick="closeModal()">Tutup</button>
        </footer>
      </article>
    </dialog>

    <p id="form-alert" hidden></p>

  </main>

  <script>
    /* ======================================================================
       KONFIGURASI
       Tempel URL Web App Google Apps Script di sini.
       Cara mendapatkannya: Deploy -> New deployment -> Web app,
       lalu salin URL yang berakhiran /exec.

      example: https://script.google.com/macros/s/AKfycbXXXXXXXX/exec
       ==================================================================== */
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvKELfAbXRC2g2kKakVEWQdzTtT_UOOf79K_iQon05QGZRScKelMau3MSXxM40HJ1G4Q/exec';

    const form = document.getElementById('attendance-form');
    const modal = document.getElementById('thanks-modal');
    const alertBox = document.getElementById('form-alert');
    const submitButton = document.getElementById('submit-button');
    const statusText = document.getElementById('form-status');

    const hpInput = document.getElementById('hp');
    const hpHelper = document.getElementById('hp-helper');
    const emailInput = document.getElementById('email');
    const emailHelper = document.getElementById('email-helper');

    const ORIGINAL_BUTTON_TEXT = submitButton.textContent;

    /* live validation feedback (in addition to native browser validation) */
    function attachValidation(input, helper, defaultText, errorText) {
      function update() {
        if (input.value.trim() === '') {
          input.removeAttribute('aria-invalid');
          helper.textContent = defaultText;
          helper.classList.remove('error');
          return;
        }
        const ok = input.checkValidity();
        input.setAttribute('aria-invalid', ok ? 'false' : 'true');
        helper.textContent = ok ? defaultText : errorText;
        helper.classList.toggle('error', !ok);
      }
      input.addEventListener('input', update);
      input.addEventListener('blur', update);
    }

    attachValidation(
      hpInput, hpHelper,
      'Format: 08xxxxxxxxxx atau +628xxxxxxxxxx',
      'Nomor HP tidak valid. Contoh: 08123456789'
    );
    attachValidation(
      emailInput, emailHelper,
      'Pastikan email aktif — materi bimtek akan dikirim ke email ini.',
      'Format email tidak valid.'
    );

    function showAlert(message) {
      alertBox.textContent = message;
      alertBox.hidden = false;
    }

    function hideAlert() {
      alertBox.hidden = true;
      alertBox.textContent = '';
    }

    function setLoading(isLoading) {
      submitButton.disabled = isLoading;
      submitButton.setAttribute('aria-busy', String(isLoading));
      submitButton.textContent = isLoading ? 'Mengirim...' : ORIGINAL_BUTTON_TEXT;
      statusText.textContent = isLoading ? 'Mohon tunggu, sedang menyimpan data.' : '';
    }

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      hideAlert();

      if (APPS_SCRIPT_URL === 'GANTI_DENGAN_URL_WEB_APP_ANDA') {
        showAlert('Form belum siap. Paste URL Web App Google Apps Script ke dalam APPS_SCRIPT_URL.');
        return;
      }

      /* Validasi bawaan browser tetap dipakai, meski atribut novalidate
         ikut dipasang agar pesan error bisa dikendalikan di sini. */
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      const payload = {
        'nama': form.elements['nama'].value.trim(),
        'tempat-tugas': form.elements['tempat-tugas'].value.trim(),
        'no-wa': form.elements['no-wa'].value.trim(),
        'email': form.elements['email'].value.trim()
      };

      setLoading(true);

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('HTTP ' + response.status);
        }

        const result = await response.json();

        if (!result.ok) {
          throw new Error(result.message || 'Data ditolak oleh server.');
        }

        modal.showModal();
        form.reset();
        resetValidation();

      } catch (error) {
        showAlert(
          'Pengiriman gagal: ' + error.message +
          '. Periksa koneksi internet Anda, lalu coba lagi.'
        );
      } finally {
        setLoading(false);
      }
    });

    function resetValidation() {
      hpInput.removeAttribute('aria-invalid');
      emailInput.removeAttribute('aria-invalid');
      hpHelper.textContent = 'Format: 08xxxxxxxxxx atau +628xxxxxxxxxx';
      emailHelper.textContent = 'Pastikan email aktif — materi bimtek akan dikirim ke email ini.';
      hpHelper.classList.remove('error');
      emailHelper.classList.remove('error');
    }

    /* klik di luar konten modal untuk menutup */
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.close();
    });

    function closeModal() {
      modal.close();
      form.reset();
      resetValidation();
    }
  </script>

  </body>
  </html>
